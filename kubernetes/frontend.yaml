apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
  namespace: eco-footprintx
  labels:
    app: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      name: frontend
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: prajwal007docker/eco-footprintx-frontend-beta:v3.3
          ports:
            - containerPort: 4173
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "300m"
              memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: eco-footprintx
spec:
  type: NodePort
  selector:
    app: frontend
  ports:
    - port: 5173
      targetPort: 4173
      protocol: TCP
      nodePort: 31000
