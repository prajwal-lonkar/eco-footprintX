apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
  namespace: eco-footprintx
  labels:
    app: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      name: backend
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: prajwal007docker/eco-footprintx-backend-beta:v2.8
          ports:
            - containerPort: 8080
          envFrom:
            - secretRef:
                name: eco-footprint-secrets
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: eco-footprintx
spec:
  type: NodePort
  selector:
    app: backend
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
      nodePort: 31100
